<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫院總額申報儀表板</title>
<meta name="description" content="醫院總額醫療服務點數申報概況：全國、各醫院與北醫體系">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <header class="topbar card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">北</div>
      <div>
        <div class="brand-title">醫院總額申報儀表板</div>
        <div class="brand-sub">臺北醫學大學 · 醫療服務點數申報概況</div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="overview" role="tab">全國概況</button>
      <button class="tab" data-view="hospitals" role="tab">各醫院</button>
      <button class="tab" data-view="tmu" role="tab">北醫體系</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切換深色／淺色模式" aria-label="切換深色／淺色模式">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="greeting">
    <div>
      <h1 id="pageTitle">全國申報概況</h1>
      <p class="muted" id="pageSub">資料載入中…</p>
    </div>
    <div class="period card">
      <div class="seg" id="periodMode">
        <button data-mode="month" class="active">單月</button>
        <button data-mode="ytd">年累計</button>
        <button data-mode="range">自訂區間</button>
      </div>
      <label class="field"><span id="startLabel">月份</span><select id="startSel"></select></label>
      <label class="field" id="endWrap" hidden><span>迄</span><select id="endSel"></select></label>
    </div>
  </section>

  <section class="filters" id="filters">
    <label class="field" data-for="overview"><span>門｜住</span>
      <select id="fType"><option value="all">全部</option><option value="op">門診</option><option value="ip">住診</option></select>
    </label>
    <label class="field" data-for="overview hospitals"><span>分區</span><select id="fRegion"></select></label>
    <label class="field" data-for="overview hospitals"><span>醫院層級</span><select id="fLevel"></select></label>
    <label class="field" data-for="hospitals"><span>體系</span><select id="fSystem"></select></label>
    <label class="field grow" data-for="hospitals"><span>搜尋醫院</span><input id="fSearch" type="search" placeholder="輸入醫院名稱…"></label>
    <div class="field" data-for="tmu"><span>趨勢圖</span>
      <div class="seg" id="trendMetric">
        <button data-m="pts" class="active">點數</button>
        <button data-m="cases">件數</button>
        <button data-m="avg">平均</button>
      </div>
    </div>
  </section>

  <main>
    <!-- 全國概況 -->
    <section class="view" id="view-overview">
      <div class="kpi-grid" id="kpis"></div>
      <div class="grid-2">
        <div class="card pad">
          <div class="card-head">
            <div><h2>每月申報點數趨勢</h2><p class="muted small" id="trendNote"></p></div>
            <div class="seg small" id="ovTrendMetric">
              <button data-m="pts" class="active">點數</button>
              <button data-m="cases">件數</button>
              <button data-m="avg">點/件</button>
            </div>
          </div>
          <div class="chart" id="ovChart"></div>
        </div>
        <div class="card pad">
          <div class="card-head"><div><h2>各分區成長率</h2><p class="muted small">點數成長％（與去年同期比）</p></div></div>
          <div id="regionBars"></div>
        </div>
      </div>
      <div class="card pad">
        <div class="card-head"><div><h2>分區</h2><p class="muted small">月平均；同期為去年相同月份</p></div></div>
        <div class="table-wrap"><table class="data" id="regionTable"></table></div>
      </div>
      <div class="card pad">
        <div class="card-head"><div><h2>醫院層級</h2><p class="muted small">依 113 年 1 月升格後層級歸類</p></div></div>
        <div class="table-wrap"><table class="data" id="levelTable"></table></div>
      </div>
    </section>

    <!-- 各醫院 -->
    <section class="view" id="view-hospitals" hidden>
      <div class="card pad">
        <div class="card-head">
          <div><h2>各醫院申報概況（月均）</h2><p class="muted small" id="hospCount"></p></div>
          <button class="btn ghost" id="csvBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
            匯出 CSV
          </button>
        </div>
        <div class="table-wrap tall"><table class="data hosp" id="hospTable"></table></div>
      </div>
    </section>

    <!-- 北醫體系 -->
    <section class="view" id="view-tmu" hidden>
      <div class="kpi-grid" id="tmuKpis"></div>
      <div id="tmuHospitals"></div>
    </section>
  </main>

  <footer class="muted small" id="footer"></footer>
</div>
<div class="tooltip" id="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
